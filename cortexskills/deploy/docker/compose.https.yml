# Optional: HTTPS in front of CortexSkills with Caddy (automatic Let's Encrypt certificates).
# Needs a DNS name pointing to this server and ports 80/443 open.
#   docker compose -f docker-compose.yml -f compose.https.yml up -d
services:
  caddy:
    image: caddy:2
    container_name: cortexskills-https
    restart: unless-stopped
    depends_on: [cortexskills]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, for example DOMAIN=skills.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
