# Reverse proxy Nginx (HTTPS) devant CortexSkills. Remplacez competences.votre-entreprise.ma et les chemins du certificat,
# copiez dans /etc/nginx/conf.d/cortexskills.conf puis : sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name competences.votre-entreprise.ma;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name competences.votre-entreprise.ma;
    ssl_certificate     /etc/letsencrypt/live/competences.votre-entreprise.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/competences.votre-entreprise.ma/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 30m;          # pièces jointes et images
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;       # exports de documents longs
    }
}
