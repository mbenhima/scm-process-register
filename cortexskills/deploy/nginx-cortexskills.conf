# Nginx reverse proxy for CortexSkills (HTTPS termination). Replace skills.example.com and the certificate paths.
server {
    listen 80;
    server_name skills.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name skills.example.com;
    ssl_certificate     /etc/letsencrypt/live/skills.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skills.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 30m;          # attachments and pictures
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;       # long document exports
    }
}
