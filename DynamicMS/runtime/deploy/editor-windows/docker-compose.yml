# DynamicMS 2026.10 — runtime éditeur en local sur Windows (Docker Desktop).
# Démarrage : .\Start-DynamicMS.ps1   (après .\Install-DynamicMS.ps1)
services:
  dynamicms:
    image: dynamicms-editor:2026.10
    container_name: dynamicms-editor
    restart: unless-stopped
    env_file: .env
    environment:
      LICENCE_SIGNING_KEY: /run/secrets/licence_private.pem
    ports:
      # Accessible depuis ce poste uniquement : http://localhost:4000
      - "127.0.0.1:${HTTP_PORT:-4000}:4000"
    volumes:
      - dynamicms-editor-data:/data
      - ./secrets/licence_private.pem:/run/secrets/licence_private.pem:ro

volumes:
  dynamicms-editor-data:
    name: dynamicms-editor-data
