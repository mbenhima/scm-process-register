# Proxy inverse HTTPS pour DynamicMS (exemple nginx). À copier dans /etc/nginx/conf.d/ puis
# adapter server_name et les chemins des certificats ; vérifier avec nginx -t puis recharger.
server {
    listen 80;
    server_name dynamicms.votre-domaine.local;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name dynamicms.votre-domaine.local;
    ssl_certificate     /etc/ssl/certs/dynamicms.crt;
    ssl_certificate_key /etc/ssl/private/dynamicms.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;           # pièces jointes et imports (10 Mo par fichier)
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;        # exports volumineux
    }
}
