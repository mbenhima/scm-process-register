<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: Arial, Helvetica, sans-serif; }
  #stage { display: inline-block; background: #ffffff; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const BRAND = '#1F4B45'
const BRAND_MID = '#275650'
const SAND = '#B8925A'
const TEAL = '#3F827B'
const RED = '#B5533C'
const GREY = '#8a9490'

function wk(m, w) { return (m - 1) * 4 + w }

const PHASES = [
  { id: 'Phase 0', start: wk(1, 1), end: wk(1, 4) },
  { id: 'Phase 1', start: wk(1, 4), end: wk(2, 3) },
  { id: 'Phase 2', start: wk(2, 4), end: wk(7, 2) },
  { id: 'Phase 3', start: wk(7, 3), end: wk(8, 3) },
  { id: 'Phase 4', start: wk(8, 4), end: wk(9, 4) },
  { id: 'Phase 5', start: wk(10, 1), end: wk(12, 4) },
  { id: 'Phase 6', start: wk(13, 1), end: wk(13, 4) },
  { id: 'Phase 7', start: wk(14, 1), end: wk(14, 4) },
]

const FRAMEWORK_ROWS = [
  { label: 'Lewin', segments: [
    { text: 'Unfreeze', start: wk(1, 1), end: wk(2, 3), state: 'steady' },
    { text: 'Unfreeze → Change', start: wk(2, 4), end: wk(7, 2), state: 'transition' },
    { text: 'Change', start: wk(7, 3), end: wk(8, 3), state: 'steady' },
    { text: 'Change → Refreeze', start: wk(8, 4), end: wk(9, 4), state: 'transition' },
    { text: 'Refreeze', start: wk(10, 1), end: wk(12, 4), state: 'steady' },
    { text: 'n/a — platform', start: wk(13, 1), end: wk(14, 4), state: 'na' },
  ]},
  { label: 'Prosci', segments: [
    { text: 'Prepare', start: wk(1, 1), end: wk(2, 3), state: 'steady' },
    { text: 'Prepare → Manage', start: wk(2, 4), end: wk(7, 2), state: 'transition' },
    { text: 'Manage', start: wk(7, 3), end: wk(8, 3), state: 'steady' },
    { text: 'Manage → Reinforce', start: wk(8, 4), end: wk(9, 4), state: 'transition' },
    { text: 'Reinforce', start: wk(10, 1), end: wk(12, 4), state: 'steady' },
    { text: 'n/a — platform', start: wk(13, 1), end: wk(14, 4), state: 'na' },
  ]},
  { label: 'Bridges', segments: [
    { text: 'Ending', start: wk(1, 1), end: wk(7, 2), state: 'steady' },
    { text: 'Neutral Zone', start: wk(7, 3), end: wk(8, 3), state: 'steady' },
    { text: 'Neutral → Beginning', start: wk(8, 4), end: wk(9, 4), state: 'transition' },
    { text: 'New Beginning', start: wk(10, 1), end: wk(12, 4), state: 'steady' },
    { text: 'n/a — platform', start: wk(13, 1), end: wk(14, 4), state: 'na' },
  ]},
]

const ADKAR_MARKERS = [
  { week: wk(2, 4), label: 'Awareness → 3' },
  { week: wk(7, 3), label: 'Desire → 2' },
]

const GO_LIVE_WEEK = wk(9, 2)

const PM_TASKS = [
  { id: 'PM0.1', name: 'Stand up hierarchy', start: wk(1, 1), end: wk(1, 2) },
  { id: 'PM0.2', name: 'Register Main Project', start: wk(1, 3), end: wk(1, 3) },
  { id: 'PM1.1', name: 'Initiative profile', start: wk(1, 4), end: wk(2, 1) },
  { id: 'PM1.2', name: 'WBS & Gantt baseline', start: wk(2, 1), end: wk(2, 2) },
  { id: 'PM5.1', name: 'Expand portfolio', start: wk(10, 1), end: wk(10, 1) },
  { id: 'PM5.2', name: 'Confirm Readiness Index', start: wk(10, 2), end: wk(11, 1) },
  { id: 'PM5.3', name: 'Benchmark peers', start: wk(11, 2), end: wk(12, 4) },
  { id: 'PM5.4', name: 'Review WBS schedule gap', start: wk(12, 4), end: wk(12, 4) },
  { id: 'PM6.1', name: 'AI governance review', start: wk(13, 1), end: wk(13, 1) },
  { id: 'PM6.2', name: 'Provision users / RBAC', start: wk(13, 2), end: wk(13, 2) },
  { id: 'PM6.3', name: 'Language precedence', start: wk(13, 3), end: wk(13, 3) },
  { id: 'PM6.4', name: 'Delete / cascade verify', start: wk(13, 4), end: wk(13, 4) },
  { id: 'PM7.1', name: 'Permission Matrix / justification', start: wk(14, 1), end: wk(14, 1) },
  { id: 'PM7.2', name: 'Activate AI use cases', start: wk(14, 1), end: wk(14, 2) },
  { id: 'PM7.3', name: 'Connect LLM provider', start: wk(14, 2), end: wk(14, 2) },
]

const CM_TASKS = [
  { id: 'CM0.1', name: 'Register & link CM Project', start: wk(1, 4), end: wk(1, 4) },
  { id: 'CM1.1', name: 'Map stakeholders', start: wk(2, 1), end: wk(2, 2) },
  { id: 'CM1.2', name: 'Sponsor visibility baseline', start: wk(2, 2), end: wk(2, 3) },
  { id: 'CM2.1', name: 'Score Awareness', start: wk(2, 4), end: wk(3, 1) },
  { id: 'CM2.2', name: 'Log adoption risk', start: wk(3, 1), end: wk(3, 1) },
  { id: 'CM2.4', name: 'Training curriculum', start: wk(3, 2), end: wk(6, 4) },
  { id: 'CM2.3', name: 'Plan communication', start: wk(7, 1), end: wk(7, 2) },
  { id: 'CM3.1', name: 'Score Desire & diagnose', start: wk(7, 3), end: wk(8, 1) },
  { id: 'CM3.2', name: 'Bridges & sentiment', start: wk(8, 1), end: wk(8, 2) },
  { id: 'CM3.3', name: 'Resistance logged & mitigated', start: wk(8, 2), end: wk(8, 3) },
  { id: 'CM4.1', name: 'Manager readiness', start: wk(8, 4), end: wk(8, 4) },
  { id: 'CM4.2', name: 'Sustainment checkpoints reviewed', start: wk(9, 1), end: wk(9, 1) },
  { id: 'CM4.3', name: 'Go-live milestone (journey map)', start: wk(9, 2), end: wk(9, 2) },
  { id: 'CM7.1', name: 'Risk mitigation + justified status', start: wk(14, 2), end: wk(14, 3) },
  { id: 'CM7.2', name: 'Divergence detection', start: wk(14, 3), end: wk(14, 3) },
  { id: 'CM7.3', name: 'Desire diagnosis & coaching', start: wk(14, 3), end: wk(14, 4) },
]

const TOTAL_WEEKS = 56
const LABEL_W = 340
const WEEK_W = 26
const ROW_H = 24
const FW_ROW_H = 30
const ADKAR_ROW_H = 34
const HEADER_H = 118
const PHASE_BAND_H = 34

function xForWeek(w) { return LABEL_W + (w - 1) * WEEK_W }
function monthOf(w) { return Math.ceil(w / 4) }

const TOTAL_W = LABEL_W + TOTAL_WEEKS * WEEK_W + 20
// Exact running total, mirroring every y-increment below: HEADER_H, the +28
// pre-phase-band gap, PHASE_BAND_H, the framework rows, the +6 pre-ADKAR gap,
// ADKAR_ROW_H, two (20+22) section headers, both task lists, the +26
// pre-legend gap, and a legend-row allowance — kept in sync by hand since
// this drives the SVG's clip box (content taller than this gets cut off).
const TOTAL_H =
  HEADER_H + 28 + PHASE_BAND_H +
  FRAMEWORK_ROWS.length * FW_ROW_H + 6 + ADKAR_ROW_H +
  (20 + 22) + PM_TASKS.length * ROW_H +
  (20 + 22) + CM_TASKS.length * ROW_H +
  26 + 40

const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
svg.setAttribute('width', TOTAL_W)
svg.setAttribute('height', TOTAL_H)
svg.setAttribute('viewBox', `0 0 ${TOTAL_W} ${TOTAL_H}`)
document.getElementById('stage').appendChild(svg)

function el(tag, attrs, text) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag)
  for (const k in attrs) e.setAttribute(k, attrs[k])
  if (text !== undefined) e.textContent = text
  return e
}

svg.appendChild(el('text', { x: TOTAL_W / 2, y: 30, 'text-anchor': 'middle', 'font-size': 20, 'font-weight': 'bold', fill: BRAND }, 'Program Timeline — WBS Gantt (14 Months)'))
svg.appendChild(el('text', { x: TOTAL_W / 2, y: 50, 'text-anchor': 'middle', 'font-size': 11.5, fill: '#666666' }, 'Kenitra Precision Manufacturing — Enterprise Platform Renewal Program · month-by-month, with weekly detail in Month 1 (setup) and Month 9 (go-live)'))

// month header
let y = HEADER_H
for (let m = 1; m <= 14; m++) {
  const x = xForWeek(wk(m, 1))
  const w = WEEK_W * 4
  svg.appendChild(el('rect', { x, y, width: w - 2, height: 24, fill: m % 2 === 0 ? BRAND : BRAND_MID }))
  svg.appendChild(el('text', { x: x + w / 2, y: y + 16, 'text-anchor': 'middle', 'font-size': 11, 'font-weight': 'bold', fill: '#ffffff' }, 'M' + m))
  if (m === 1 || m === 9) {
    for (let wi = 1; wi <= 4; wi++) {
      const wx = xForWeek(wk(m, wi))
      svg.appendChild(el('text', { x: wx + WEEK_W / 2, y: y - 4, 'text-anchor': 'middle', 'font-size': 7.5, fill: '#8a9490' }, 'w' + wi))
    }
  }
}
svg.appendChild(el('text', { x: 6, y: y + 16, 'font-size': 10, 'font-weight': 'bold', fill: BRAND }, 'Phase'))

// go-live marker (drawn last, on top, positioned near the title so it never collides with week ticks)
const goLiveX = xForWeek(GO_LIVE_WEEK) + WEEK_W / 2

// phase band
y += 28
PHASES.forEach((p, i) => {
  const x = xForWeek(p.start)
  const w = xForWeek(p.end) + WEEK_W - x - 2
  svg.appendChild(el('rect', { x, y, width: w, height: PHASE_BAND_H - 2, fill: i % 2 === 0 ? BRAND : BRAND_MID }))
  svg.appendChild(el('text', { x: x + w / 2, y: y + PHASE_BAND_H / 2 + 4, 'text-anchor': 'middle', 'font-size': 10.5, 'font-weight': 'bold', fill: '#ffffff' }, p.id))
})

// framework rows
y += PHASE_BAND_H
const stateFill = { steady: TEAL, transition: SAND, na: GREY }
FRAMEWORK_ROWS.forEach((row) => {
  svg.appendChild(el('text', { x: 6, y: y + FW_ROW_H / 2 + 4, 'font-size': 10.5, 'font-weight': 'bold', fill: BRAND }, row.label))
  row.segments.forEach((seg) => {
    const x = xForWeek(seg.start)
    const w = xForWeek(seg.end) + WEEK_W - x - 2
    svg.appendChild(el('rect', { x, y: y + 3, width: w, height: FW_ROW_H - 8, rx: 3, fill: stateFill[seg.state], opacity: seg.state === 'na' ? 0.35 : 0.85 }))
    svg.appendChild(el('text', { x: x + w / 2, y: y + FW_ROW_H / 2 + 3, 'text-anchor': 'middle', 'font-size': 8.5, fill: '#ffffff', 'font-weight': 'bold' }, w > 60 ? seg.text : ''))
  })
  y += FW_ROW_H
})

// ADKAR milestone row
y += 6
svg.appendChild(el('text', { x: 6, y: y + ADKAR_ROW_H / 2 + 4, 'font-size': 10.5, 'font-weight': 'bold', fill: BRAND }, 'ADKAR'))
svg.appendChild(el('line', { x1: LABEL_W, x2: TOTAL_W - 10, y1: y + ADKAR_ROW_H / 2, y2: y + ADKAR_ROW_H / 2, stroke: '#d8c69c', 'stroke-width': 1, 'stroke-dasharray': '2,3' }))
ADKAR_MARKERS.forEach((m) => {
  const x = xForWeek(m.week) + WEEK_W / 2
  svg.appendChild(el('path', { d: `M ${x} ${y + 6} L ${x + 8} ${y + ADKAR_ROW_H / 2} L ${x} ${y + ADKAR_ROW_H - 6} L ${x - 8} ${y + ADKAR_ROW_H / 2} Z`, fill: RED }))
  svg.appendChild(el('text', { x, y: y - 2, 'text-anchor': 'middle', 'font-size': 9, 'font-weight': 'bold', fill: RED }, m.label))
})
y += ADKAR_ROW_H

// section header helper
function sectionHeader(label, fill) {
  y += 20
  svg.appendChild(el('rect', { x: 0, y, width: TOTAL_W - 10, height: 22, fill }))
  svg.appendChild(el('text', { x: 6, y: y + 16, 'font-size': 11, 'font-weight': 'bold', fill: '#ffffff' }, label))
  y += 22
}

function taskRows(tasks, color) {
  tasks.forEach((t) => {
    svg.appendChild(el('text', { x: 6, y: y + ROW_H / 2 + 4, 'font-size': 9.5, fill: '#16221f' }, `${t.id}  ${t.name}`))
    const isMilestone = t.start === t.end
    if (isMilestone) {
      const x = xForWeek(t.start) + WEEK_W / 2
      svg.appendChild(el('rect', { x: x - 5, y: y + ROW_H / 2 - 5, width: 10, height: 10, fill: color, transform: `rotate(45 ${x} ${y + ROW_H / 2})` }))
    } else {
      const x = xForWeek(t.start)
      const w = xForWeek(t.end) + WEEK_W - x - 2
      svg.appendChild(el('rect', { x, y: y + 5, width: w, height: ROW_H - 10, rx: 3, fill: color }))
    }
    y += ROW_H
  })
}

sectionHeader('Project Management Track', SAND)
taskRows(PM_TASKS, SAND)

sectionHeader('Change Management Track', TEAL)
taskRows(CM_TASKS, TEAL)

// go-live vertical line, drawn on top of everything, spanning the whole body
const bodyTop = HEADER_H
svg.insertBefore(el('line', { x1: goLiveX, x2: goLiveX, y1: bodyTop, y2: y + 10, stroke: RED, 'stroke-width': 1.5, 'stroke-dasharray': '5,4' }), svg.lastChild)
const goLiveLabelBg = el('rect', { x: goLiveX - 52, y: 62, width: 104, height: 16, fill: '#ffffff' })
svg.appendChild(goLiveLabelBg)
svg.appendChild(el('text', { x: goLiveX, y: 74, 'text-anchor': 'middle', 'font-size': 11, 'font-weight': 'bold', fill: RED }, 'GO-LIVE (M9·W2)'))

// legend
y += 26
const legendItems = [
  { swatch: 'rect', color: SAND, label: 'Project Management task' },
  { swatch: 'rect', color: TEAL, label: 'Change Management task' },
  { swatch: 'diamond', color: RED, label: 'ADKAR score-change milestone' },
  { swatch: 'line', color: RED, label: 'Go-live cutover' },
]
let lx = 10
legendItems.forEach((item) => {
  if (item.swatch === 'rect') {
    svg.appendChild(el('rect', { x: lx, y: y - 10, width: 16, height: 10, fill: item.color }))
  } else if (item.swatch === 'diamond') {
    svg.appendChild(el('rect', { x: lx + 3, y: y - 10, width: 8, height: 8, fill: item.color, transform: `rotate(45 ${lx + 7} ${y - 6})` }))
  } else {
    svg.appendChild(el('line', { x1: lx, x2: lx + 16, y1: y - 5, y2: y - 5, stroke: item.color, 'stroke-width': 2, 'stroke-dasharray': '4,3' }))
  }
  svg.appendChild(el('text', { x: lx + 22, y: y - 2, 'font-size': 9.5, fill: '#16221f' }, item.label))
  lx += 22 + item.label.length * 5.6 + 22
})
</script>
</body>
</html>
